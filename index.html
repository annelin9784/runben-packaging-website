  const getRoute = () => { const rawSource = location.hash.slice(1) || '/zh'; const raw = rawSource.replace(/^\/(zh|en)#(factory|process|inquiry)$/, '/$1?section=$2'); const [pathname, query=''] = raw.split('?'); const bits = pathname.split('/').filter(Boolean); const locale = bits[0] === 'en' ? 'en' : 'zh'; return { locale, pathname, query: new URLSearchParams(query), slug: bits[2] || null, page: bits[1] || 'home' }; };
  const pathFor = (locale, pathname, query='') => '#' + pathname.replace(/^\/(zh|en)/, '/' + locale) + (query ? '?' + query : '');
  const categories = D.categories;
  const categoryName = (key, locale) => text(categories.find(c=>c.key===key)?.name || key, locale);
  const productImage = (asset, locale) => asset ? '<img src="' + esc(asset.src) + '" alt="' + esc(text(asset.alt, locale)) + '"><span class="img-fallback" hidden>RUNBEN</span>' : '<div class="empty">Image unavailable</div>';
  const productCard = (p, locale) => '<a class="product-card" href="' + pathFor(locale, '/' + locale + '/products/' + p.slug) + '"><div class="product-image">' + productImage(p.images.main, locale) + '</div><div class="card-body"><div class="card-meta">' + esc(p.code) + '</div><h3>' + esc(text(p.name, locale)) + '</h3><div class="card-meta">' + esc(text(p.description, locale)) + '</div></div></a>';
  const renderHeader = (locale, active) => { const c=D.copy[locale]; return '<header class="site-header"><div class="container header-inner"><a class="brand" href="#/' + locale + '"><img src="./assets/runben-logo.svg" alt="润本容器 RUNBEN"></a><nav class="nav"><a class="' + (active==='home'?'active':'') + '" href="#/' + locale + '">' + esc(c.nav.home) + '</a><a class="' + (active==='products'?'active':'') + '" href="#/' + locale + '/products">' + esc(c.nav.products) + '</a><a href="#/' + locale + '#factory">' + esc(c.nav.factory) + '</a><a href="#/' + locale + '#process">' + esc(c.nav.process) + '</a><a href="#/' + locale + '#inquiry">' + esc(c.nav.inquiry) + '</a></nav><div class="header-actions"><a class="lang" href="' + pathFor(locale==='zh'?'en':'zh', getRoute().pathname, getRoute().query.toString()) + '">' + (locale==='zh'?'EN':'中') + '</a><button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button></div></div><div class="mobile-nav" id="mobileNav"><a href="#/' + locale + '">' + esc(c.nav.home) + '</a><a href="#/' + locale + '/products">' + esc(c.nav.products) + '</a><a href="#/' + locale + '#factory">' + esc(c.nav.factory) + '</a><a href="#/' + locale + '#process">' + esc(c.nav.process) + '</a><a href="#/' + locale + '#inquiry">' + esc(c.nav.inquiry) + '</a></div></header>'; };
  const renderFooter = (locale) => { const c=D.copy[locale], f=c.footerInfo; return '<footer class="site-footer"><div class="container footer-grid"><div><h3>' + esc(f.aboutTitle) + '</h3><p>' + esc(f.about) + '</p></div><div><h3>' + esc(f.servicesTitle) + '</h3><ul><li>' + esc(c.nav.factory) + '</li><li>' + esc(c.nav.process) + '</li><li>' + esc(c.nav.inquiry) + '</li></ul></div><div><h3>' + esc(f.productsTitle) + '</h3><ul>' + D.categories.map(x=>'<li><a href="#/' + locale + '/products?category=' + x.key + '">' + esc(text(x.name, locale)) + '</a></li>').join('') + '</ul></div><div><h3>' + esc(f.contactTitle) + '</h3><p>' + esc(f.phoneLabel) + ': <a href="' + esc(f.phoneHref) + '">' + esc(f.phoneDisplay) + '</a></p><p>' + esc(f.officeLabel) + ': ' + esc(f.office) + '</p><p>' + esc(f.factoryLabel) + ': ' + esc(f.factory) + '</p></div></div><div class="container copyright">© 2026 RUNBEN CONTAINER · ' + esc(c.footer) + '</div></footer>'; };
  const bindImageFallbacks = () => document.querySelectorAll('img').forEach(img => img.addEventListener('error', () => { img.hidden=true; const fallback=img.nextElementSibling; if(fallback) fallback.hidden=false; }));
  const bindMenu = () => { const b=document.getElementById('menuBtn'), n=document.getElementById('mobileNav'); if(b&&n) b.addEventListener('click',()=>n.classList.toggle('open')); };
  function renderHome(locale){ const c=D.copy[locale]; let slide=0; const posters=D.heroPosters; app.innerHTML=renderHeader(locale,'home') + '<main><section class="hero"><div class="container hero-grid"><div><div class="eyebrow">' + esc(c.heroEyebrow) + '</div><h1>' + esc(c.heroTitle) + '</h1><p>' + esc(c.heroBody) + '</p><div class="cta-row"><a class="btn" href="#/' + locale + '/products">' + esc(c.explore) + ' ↗</a><a class="btn secondary" href="#/' + locale + '#inquiry">' + esc(c.quote) + ' →</a></div></div><div class="hero-carousel"><img id="heroImg" src="' + esc(posters[0].src) + '" alt="' + esc(text(posters[0].alt,locale)) + '"><button class="carousel-control prev" id="heroPrev" aria-label="Previous">←</button><button class="carousel-control next" id="heroNext" aria-label="Next">→</button><div class="dots">' + posters.map((_,i)=>'<button class="dot ' + (i===0?'active':'') + '" data-slide="' + i + '" aria-label="' + (i+1) + '"></button>').join('') + '</div></div></div></section><section class="section"><div class="container"><div class="strengths">' + c.strengths.map(x=>'<div class="strength"><strong>' + esc(x[0]) + '</strong><span class="muted">' + esc(x[1]) + '</span></div>').join('') + '</div></div></section><section class="section"><div class="container section-head"><div><div class="kicker">' + esc(c.featuredKicker) + '</div><h2>' + esc(c.featuredTitle) + '</h2></div><p class="muted">' + esc(c.featuredBody) + '</p></div><div class="container product-grid">' + D.products.filter(p=>p.featured).map(p=>productCard(p,locale)).join('') + '</div></section><section class="section dark" id="factory"><div class="container"><div class="section-head"><div><div class="kicker">' + esc(c.categoryKicker) + '</div><h2>' + esc(c.categoryTitle) + '</h2></div></div><div class="category-list">' + c.categories.map((cat,i)=>'<a class="category-row" href="#/' + locale + '/products?category=' + cat[0] + '"><span>0' + (i+1) + '</span><div><h3>' + esc(cat[1]) + '</h3><p>' + esc(cat[2]) + '</p></div><span class="arrow">↗</span></a>').join('') + '</div></div></section><section class="section"><div class="container factory-grid"><div><div class="kicker">' + esc(c.factoryKicker) + '</div><h2>' + esc(c.factoryTitle) + '</h2><p class="muted">' + esc(c.factoryBody) + '</p></div><div class="capability-list">' + c.capabilities.map(x=>'<div class="capability">' + esc(x) + '</div>').join('') + '</div></div></section><section class="section dark" id="process"><div class="container"><div class="kicker">' + esc(c.processKicker) + '</div><h2>' + esc(c.processTitle) + '</h2><div class="steps">' + c.steps.map(x=>'<div class="step"><span>' + esc(x[0]) + '</span><div><h3>' + esc(x[1]) + '</h3><p class="muted">' + esc(x[2]) + '</p></div></div>').join('') + '</div></div></section><section class="section" id="inquiry"><div class="container"><div class="cta"><div class="kicker">RUNBEN</div><h2>' + esc(c.ctaTitle) + '</h2><p class="muted">' + esc(c.ctaBody) + '</p><a class="btn" href="tel:+8618128753617">' + esc(c.footerInfo.phoneDisplay) + '</a><p class="muted">' + (locale==='zh'?'离线文件仅供浏览；正式询价请访问线上官网。':'Offline preview only; visit the live website for enquiries.') + '</p></div></div></section></main>' + renderFooter(locale); bindMenu(); bindImageFallbacks(); const img=document.getElementById('heroImg'), dots=[...document.querySelectorAll('.dot')]; const go=(n)=>{slide=(n+posters.length)%posters.length;img.src=posters[slide].src;img.alt=text(posters[slide].alt,locale);dots.forEach((d,i)=>d.classList.toggle('active',i===slide));}; document.getElementById('heroPrev').onclick=()=>go(slide-1); document.getElementById('heroNext').onclick=()=>go(slide+1); dots.forEach(d=>d.onclick=()=>go(Number(d.dataset.slide))); let timer=setInterval(()=>go(slide+1),3000); document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(timer)}else{timer=setInterval(()=>go(slide+1),3000)}}); }
  function renderProducts(locale){ const c=D.copy[locale], route=getRoute(); const currentCat=route.query.get('category')||''; const query=route.query.get('q')||''; app.innerHTML=renderHeader(locale,'products') + '<main class="container"><section class="page-hero"><div class="kicker">' + esc(c.categoryKicker) + '</div><h1>' + esc(c.categoryTitle) + '</h1><p class="muted">' + esc(c.featuredBody) + '</p></section><div class="filters"><input id="search" value="' + esc(query) + '" placeholder="' + (locale==='zh'?'搜索产品、编号、材质…':'Search products, code, material…') + '"><div class="chips"><button class="chip ' + (!currentCat?'active':'') + '" data-cat="">' + (locale==='zh'?'全部产品':'All products') + '</button>' + categories.map(x=>'<button class="chip ' + (currentCat===x.key?'active':'') + '" data-cat="' + x.key + '">' + esc(text(x.name,locale)) + '</button>').join('') + '</div></div><div id="results"></div></main>' + renderFooter(locale); bindMenu(); const results=document.getElementById('results'), search=document.getElementById('search'); const draw=()=>{const q=search.value.trim().toLowerCase();const arr=D.products.filter(p=>(!currentCat||p.categories.includes(currentCat))&&(!q||[p.code,p.slug,p.subcategory,text(p.name,locale),text(p.description,locale),text(p.specs.material,locale),...p.categories].join(' ').toLowerCase().includes(q)));results.innerHTML=arr.length?'<div class="product-grid">'+arr.map(p=>productCard(p,locale)).join('')+'</div>':'<div class="empty">'+(locale==='zh'?'没有找到匹配产品，请清空条件后重试。':'No products match these filters.')+'</div>';bindImageFallbacks();}; search.addEventListener('input',()=>{const params=new URLSearchParams(route.query);params.set('q',search.value);location.hash='#/'+locale+'/products?'+params.toString();}); document.querySelectorAll('[data-cat]').forEach(btn=>btn.addEventListener('click',()=>{const params=new URLSearchParams();if(btn.dataset.cat)params.set('category',btn.dataset.cat);if(search.value)params.set('q',search.value);location.hash='#/'+locale+'/products'+(params.toString()?'?'+params.toString():'')})); draw(); }
  function renderDetail(locale,slug){ const p=D.products.find(x=>x.slug===slug); if(!p){location.hash='#/'+locale+'/products';return;} const c=D.copy[locale]; const assets=[p.images.main,...p.images.gallery,p.images.dimension,p.images.effect].filter(Boolean); let idx=0; app.innerHTML=renderHeader(locale,'products') + '<main class="container detail"><div class="breadcrumb"><a href="#/' + locale + '/products">' + esc(c.nav.products) + '</a> / ' + esc(text(p.name,locale)) + '</div><div class="detail-grid"><div><div class="gallery-main">' + productImage(assets[0],locale) + '<button class="gallery-control prev" id="gPrev" aria-label="Previous">←</button><button class="gallery-control next" id="gNext" aria-label="Next">→</button></div><div class="thumbs">' + assets.map((a,i)=>'<button class="thumb ' + (i===0?'active':'') + '" data-index="' + i + '" aria-label="' + esc(text(a.alt,locale)) + '">' + productImage(a,locale) + '</button>').join('') + '</div></div><div><div class="code">' + esc(p.code) + '</div><h1>' + esc(text(p.name,locale)) + '</h1><p class="detail-desc">' + esc(text(p.description,locale)) + '</p><div class="specs"><div class="spec"><b>Capacity</b><span>' + esc(p.variants.map(v=>v.capacity).join(' / ')) + '</span></div><div class="spec"><b>Material</b><span>' + esc(text(p.specs.material,locale)) + '</span></div><div class="spec"><b>Dimensions</b><span>' + esc(p.variants.map(v=>text(v.dimensions,locale)).join(' · ')) + '</span></div><div class="spec"><b>Color</b><span>' + esc(text(p.specs.color,locale)) + '</span></div><div class="spec"><b>Surface Finish</b><span>' + esc(text(p.specs.finish,locale)) + '</span></div><div class="spec"><b>MOQ</b><span>' + esc(p.specs.moq) + '</span></div></div><div class="offline-note"><strong>' + (locale==='zh'?'离线预览提示':'Offline preview') + '</strong><p>' + (locale==='zh'?'本地 HTML 不能发送询价，请通过线上官网或电话联系我们。':'This local HTML cannot submit enquiries. Please use the live website or call us.') + '</p><a class="btn" href="tel:+8618128753617">' + esc(c.footerInfo.phoneDisplay) + '</a></div></div></div><section class="section"><div class="section-head"><h2>' + (locale==='zh'?'相关产品':'Related products') + '</h2></div><div class="product-grid">' + D.products.filter(x=>x.slug!==p.slug&&x.categories.some(cat=>p.categories.includes(cat))).slice(0,3).map(x=>productCard(x,locale)).join('') + '</div></section></main>' + renderFooter(locale); bindMenu(); bindImageFallbacks(); const main=document.querySelector('.gallery-main'); const thumbs=[...document.querySelectorAll('.thumb')]; const go=(n)=>{idx=(n+assets.length)%assets.length;main.querySelector('img')?.remove();main.querySelector('.img-fallback')?.remove();main.insertAdjacentHTML('afterbegin',productImage(assets[idx],locale));bindImageFallbacks();thumbs.forEach((b,i)=>b.classList.toggle('active',i===idx));}; document.getElementById('gPrev').onclick=()=>go(idx-1);document.getElementById('gNext').onclick=()=>go(idx+1);thumbs.forEach(b=>b.onclick=()=>go(Number(b.dataset.index)));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(idx-1);if(e.key==='ArrowRight')go(idx+1)}); }
  function render(){const r=getRoute();document.documentElement.lang=r.locale==='zh'?'zh-CN':'en';document.title='RUNBEN Packaging · '+(r.locale==='zh'?'润本容器':'RUNBEN Container');if(r.page==='products'&&r.slug)renderDetail(r.locale,r.slug);else if(r.page==='products')renderProducts(r.locale);else renderHome(r.locale);app.insertAdjacentHTML('afterbegin','<aside class="pages-notice" aria-label="Static preview notice">静态展示版 · Static preview <a href="https://runben-packaging.annelin9784.chatgpt.site/'+r.locale+'" rel="noopener">访问正式官网 / Official website ↗</a></aside>');const section=r.query.get('section');if(section){requestAnimationFrame(()=>document.getElementById(section)?.scrollIntoView())}else{window.scrollTo(0,0);}}
  window.addEventListener('hashchange',render); render();
})();
</script></body></html>
